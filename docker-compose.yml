services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LaelNexus_dev_2026!"
    ports:
      - "1433:1433"
    volumes:
      - lael-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend/LaelNexus.Api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__FrontendOrigins__0: "http://localhost:8080"
      ConnectionStrings__LaelNexus: "Server=sqlserver,1433;Database=LaelNexus;User Id=sa;Password=LaelNexus_dev_2026!;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  lael-sqlserver-data:
